name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'project.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Maritime Simulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Download Godot 4.3
        run: |
          mkdir -p "$RUNNER_TEMP/godot"

          curl -fL \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot/godot.zip"

          unzip -q "$RUNNER_TEMP/godot/godot.zip" \
            -d "$RUNNER_TEMP/godot"

          chmod +x "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"

      - name: Install Godot Android export templates
        run: |
          mkdir -p "$RUNNER_TEMP/templates"

          curl -fL \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -o "$RUNNER_TEMP/templates/templates.tpz"

          unzip -q "$RUNNER_TEMP/templates/templates.tpz" \
            -d "$RUNNER_TEMP/templates"

          TEMPLATE_DIR=$(find "$RUNNER_TEMP/templates" \
            -type f -name android_debug.apk \
            -printf '%h\n' | head -1)

          if [ -z "$TEMPLATE_DIR" ]; then
            echo "ERROR: Android export templates not found"
            exit 1
          fi

          DEST="$HOME/.local/share/godot/export_templates/4.3.stable"

          mkdir -p "$DEST"
          cp -a "$TEMPLATE_DIR/." "$DEST/"

          ls -lh "$DEST"

      - name: Extract project.zip
        run: |
          mkdir -p project
          unzip -q project.zip -d project

          if [ ! -f project/project.godot ]; then
            echo "ERROR: project.godot missing!"
            find project -maxdepth 3 -type f
            exit 1
          fi

          if [ ! -f project/export_presets.cfg ]; then
            echo "ERROR: export_presets.cfg missing!"
            exit 1
          fi

      - name: Configure Godot Android settings
        run: |
          mkdir -p "$HOME/.config/godot"

          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project resources
        run: |
          "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" \
            --headless \
            --editor \
            --path project \
            --import

      - name: Build Android APK
        run: |
          mkdir -p build

          "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" \
            --headless \
            --path project \
            --export-debug "Android" \
            build/maritime-simulator.apk

          if [ ! -s build/maritime-simulator.apk ]; then
            echo "ERROR: APK generation failed!"
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL!"
          ls -lh build/maritime-simulator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maritime-Simulator-APK
          path: build/maritime-simulator.apk
          if-no-files-found: error
          retention-days: 30
