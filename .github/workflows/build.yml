name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'project.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Maritime Simulator APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q project.zip -d project

          test -f project/project.godot || {
            echo "ERROR: project.godot not found"
            exit 1
          }

      - name: Install and configure Android SDK
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk

          SDKMANAGER=$(find / -type f -name sdkmanager 2>/dev/null | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager not found"
            exit 1
          fi

          SDK_ROOT=$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")

          if [ ! -d "$SDK_ROOT/platform-tools" ]; then
            SDK_ROOT=$(dirname "$(dirname "$(find / -type f -name adb 2>/dev/null | head -1)")")
          fi

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          echo "Android SDK: $SDK_ROOT"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")

          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          mkdir -p ~/.config/godot

          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Configure debug keystore
        run: |
          if [ ! -f /root/debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore /root/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Import project
        run: |
          godot --headless --editor \
            --path project \
            --import

      - name: Build Android APK
        run: |
          mkdir -p build

          godot --headless \
            --path project \
            --export-debug "Android" \
            build/maritime-simulator.apk

          if [ ! -s build/maritime-simulator.apk ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK successfully generated!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maritime-Simulator-APK
          path: build/maritime-simulator.apk
          if-no-files-found: error
          retention-days: 30
