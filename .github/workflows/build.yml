name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'project.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Maritime Simulator APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project.zip
        run: |
          mkdir -p project
          unzip -q project.zip -d project

          echo "Project files:"
          ls -la project/

          if [ ! -f project/project.godot ]; then
            echo "ERROR: project.godot not found!"
            exit 1
          fi

      - name: Configure Android export
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config/godot

          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -r /root/.local/share/godot/export_templates/4.3.stable \
              ~/.local/share/godot/export_templates/
          fi

          keytool -genkeypair \
            -v \
            -keystore /root/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > ~/.config/godot/editor_settings-4.3.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          cp ~/.config/godot/editor_settings-4.3.tres \
             ~/.config/godot/editor_settings-4.tres

      - name: Import project resources
        run: |
          godot --headless --editor --path project --import

      - name: Build Android APK
        run: |
          mkdir -p build

          godot --headless \
            --path project \
            --export-debug "Android" \
            build/maritime-simulator.apk

          test -s build/maritime-simulator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maritime-Simulator-APK
          path: build/maritime-simulator.apk
          if-no-files-found: error
          retention-days: 30
