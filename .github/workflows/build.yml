name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot, export templates and debug keystore
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/godot
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ] && [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deploy
          mv debug.keystore /root/debug.keystore
          cat > ~/.config/godot/editor_settings-4.tres <<'SETTINGS'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          SETTINGS

      - name: Import project resources
        run: godot --headless --verbose --import || true

      - name: Export debug APK
        run: |
          mkdir -v -p build
          godot --headless --verbose --export-debug "Android" build/maritime-simulator.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maritime-simulator-apk
          path: build/maritime-simulator.apk

      - name: Attach APK to GitHub release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/maritime-simulator.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
