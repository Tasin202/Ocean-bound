name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3.0

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Godot project
        run: |
          echo "--- repo contents ---"
          find . -maxdepth 3 -not -path './.git/*' | head -60
          F=$(find . -maxdepth 4 -name project.godot -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "::error::No project.godot found anywhere in the repo"
            exit 1
          fi
          D=$(dirname "$F")
          echo "Project directory: $D"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"

      - name: Ensure export_presets.cfg exists
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f export_presets.cfg ]; then
            echo "export_presets.cfg missing - generating it"
            cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/maritime-simulator.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.tasin.maritimesim"
          package/name="Maritime Simulator"
          package/signed=true
          screen/immersive_mode=true
          screen/orientation=0
          permissions/internet=true
          EOF
          fi
          cat export_presets.cfg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ] || [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            set +o pipefail
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34"
          fi

      - name: Set up Godot + export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Create debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$HOME/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999

      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF

      - name: Import project resources
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p .godot/editor build
          godot --headless --verbose --import 2>&1 | grep -v "is not exposed, skipping" || true
          ls .godot || true

      - name: Export debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          godot --headless --verbose --export-debug "Android" build/maritime-simulator.apk 2>&1 | grep -v "is not exposed, skipping" | tail -n 80
          test -s build/maritime-simulator.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maritime-simulator-apk
          path: ${{ env.PROJECT_DIR }}/build/maritime-simulator.apk

      - name: Attach APK to GitHub release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/build/maritime-simulator.apk
